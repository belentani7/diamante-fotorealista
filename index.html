<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070c" />
    <title>Diamante · estudio óptico procedural</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        background: #05070c;
        color: #e8ecf4;
        font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      canvas {
        display: block;
        touch-action: none;
      }

      #root {
        position: relative;
        isolation: isolate;
      }

      .boot {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 14px;
        justify-items: center;
        background: radial-gradient(120% 90% at 50% 12%, #16203a 0%, #05070c 62%);
        font-size: 11px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #7f8ca8;
        z-index: 40;
        transition: opacity 700ms ease;
      }

      .boot[data-hidden='true'] {
        opacity: 0;
        pointer-events: none;
      }

      .boot__gem {
        width: 44px;
        height: 44px;
        border: 1px solid rgba(160, 196, 255, 0.34);
        transform: rotate(45deg);
        animation: boot-spin 2.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      @keyframes boot-spin {
        0% {
          transform: rotate(45deg) scale(0.82);
          opacity: 0.35;
        }
        50% {
          transform: rotate(225deg) scale(1);
          opacity: 1;
        }
        100% {
          transform: rotate(405deg) scale(0.82);
          opacity: 0.35;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot__gem {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" id="boot">
        <div class="boot__gem"></div>
        <span>Compilando óptica</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
